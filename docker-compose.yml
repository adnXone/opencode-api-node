services:
  opencode-api-node:
    build: .
    ports:
      - "${PORT:-80}:80"
    environment:
      - API_KEY=${API_KEY:-} # leave empty to disable auth, e.g. API_KEY=sk-mykey
      - PORT=80
      - OPENCODE_TIMEOUT=${OPENCODE_TIMEOUT:-15000}
      - OPENCODE_MESSAGE_TIMEOUT=${OPENCODE_MESSAGE_TIMEOUT:-300000}
      - OPENCODE_RETRIES=${OPENCODE_RETRIES:-1}
